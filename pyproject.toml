[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "fepp-cd"
version = "1.0.0"
description = "Federated, Explainable, Privacy-Preserving Cyberbullying Detection (FedAvg + SecAgg + DistilBERT + Integrated Gradients)"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
dependencies = ["numpy>=1.24", "pandas>=2.0", "scipy>=1.10", "scikit-learn>=1.3", "matplotlib>=3.7", "pyyaml>=6.0", "tabulate>=0.9"]

[project.optional-dependencies]
train = ["torch>=2.1", "transformers>=4.40", "tokenizers>=0.15", "captum>=0.7"]
dev = ["pytest>=7"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
